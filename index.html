<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逃离古堡 - Escape Castle</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a0a2e;
            --bg-purple: #2d1b4e;
            --gold: #ffd700;
            --gold-light: #ffec8b;
            --red-danger: #ff4757;
            --green-success: #2ed573;
            --wall-color: #4a3a6e;
            --floor-color: #3d2b5e;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-purple) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 71, 87, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .game-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .game-title {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(16px, 4vw, 28px);
            color: var(--gold);
            text-shadow: 
                0 0 10px var(--gold),
                0 0 20px var(--gold),
                0 0 40px rgba(255, 215, 0, 0.5);
            letter-spacing: 4px;
            animation: glow-pulse 2s ease-in-out infinite alternate;
            text-align: center;
        }

        @keyframes glow-pulse {
            from {
                text-shadow: 
                    0 0 10px var(--gold),
                    0 0 20px var(--gold),
                    0 0 40px rgba(255, 215, 0, 0.5);
            }
            to {
                text-shadow: 
                    0 0 20px var(--gold),
                    0 0 40px var(--gold),
                    0 0 60px rgba(255, 215, 0, 0.8);
            }
        }

        .info-panel {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .info-box {
            background: rgba(45, 27, 78, 0.9);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 12px 24px;
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.3),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 100px;
        }

        .info-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            color: var(--gold);
            text-shadow: 0 0 8px var(--gold);
        }

        .game-board-wrapper {
            position: relative;
            padding: 8px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
            border-radius: 16px;
            box-shadow: 
                0 0 30px var(--gold),
                0 0 60px rgba(255, 215, 0, 0.4);
        }

        .game-board-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, var(--gold), var(--red-danger), var(--gold));
            border-radius: 20px;
            z-index: -1;
            filter: blur(20px;
            animation: rotate-glow 4s linear infinite;
        }

        @keyframes rotate-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        #game-canvas {
            display: block;
            background: var(--bg-dark);
            border-radius: 12px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            padding: 14px 32px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
            transform: translateY(-3px) scale(1.05);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--red-danger), #ff6b81);
            color: var(--text-white);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }

        .btn-danger:hover {
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.7);
            transform: translateY(-3px) scale(1.05);
        }

        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
            width: 200px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            border: 3px solid var(--gold);
            background: rgba(255, 215, 0, 0.15);
            border-radius: 50%;
            color: var(--gold);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-weight: bold;
        }

        .touch-btn:active {
            background: rgba(255, 215, 0, 0.4);
            transform: scale(0.9);
            box-shadow: 0 0 25px var(--gold);
        }

        .touch-up {
            grid-column: 2;
            grid-row: 1;
        }

        .touch-left {
            grid-column: 1;
            grid-row: 2;
        }

        .touch-down {
            grid-column: 2;
            grid-row: 2;
        }

        .touch-right {
            grid-column: 3;
            grid-row: 2;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 10, 46, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 30px;
            text-align: center;
        }

        .game-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(18px, 5vw, 24px);
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold);
            line-height: 1.5;
        }

        .overlay-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            max-width: 400px;
            line-height: 1.8;
        }

        .overlay-score {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: var(--gold-light);
            margin-top: 10px;
        }

        .overlay-score span {
            color: var(--gold);
        }

        .instructions {
            background: rgba(74, 58, 110, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: left;
            max-width: 350px;
        }

        .instructions p {
            color: rgba(255, 255, 255, 0.9);
            margin: 8px 0;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instructions .icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
        }

        .key-icon {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .trap-icon {
            background: var(--red-danger);
            color: white;
        }

        .exit-icon {
            background: var(--green-success);
            color: white;
        }

        .player-icon {
            background: #74b9ff;
            color: var(--bg-dark);
        }

        @media (max-width: 600px) {
            .touch-controls {
                display: grid;
            }
            
            .game-title {
                font-size: 14px;
            }

            .info-box {
                padding: 8px 16px;
                min-width: 80px;
            }

            .info-value {
                font-size: 12px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: grid;
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🏰 逃离古堡 🏰</h1>
        
        <div class="info-panel">
            <div class="info-box">
                <div class="info-label">🗝️ 钥匙</div>
                <div class="info-value" id="keys-count">0 / 3</div>
            </div>
            <div class="info-box">
                <div class="info-label">⏱️ 时间</div>
                <div class="info-value" id="time">00:00</div>
            </div>
            <div class="info-box">
                <div class="info-label">⭐ 分数</div>
                <div class="info-value" id="score">0</div>
            </div>
        </div>
        
        <div class="game-board-wrapper">
            <canvas id="game-canvas" width="600" height="480"></canvas>
            
            <div class="game-overlay" id="start-overlay">
                <div class="overlay-title">🏰 逃离古堡 🏰</div>
                <div class="overlay-subtitle">在神秘的古堡中探险！</div>
                <div class="instructions">
                    <p><span class="icon player-icon">😊</span> 你是可爱的冒险者</p>
                    <p><span class="icon key-icon">🗝️</span> 收集所有钥匙</p>
                    <p><span class="icon trap-icon">⚠️</span> 避开危险的陷阱</p>
                    <p><span class="icon exit-icon">🚪</span> 找到出口逃离！</p>
                </div>
                <div class="overlay-subtitle">
                    使用 方向键 或 触摸按钮 移动
                </div>
            </div>
            
            <div class="game-overlay" id="win-overlay">
                <div class="overlay-title">🎉 恭喜逃离！🎉</div>
                <div class="overlay-score">用时：<span id="win-time">00:00</span></div>
                <div class="overlay-score">得分：<span id="win-score">0</span></div>
            </div>
            
            <div class="game-overlay" id="lose-overlay">
                <div class="overlay-title">💀 陷阱触发！💀</div>
                <div class="overlay-subtitle">小心陷阱太危险了...</div>
                <div class="overlay-score">得分：<span id="lose-score">0</span></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="start-btn">开始冒险</button>
            <button class="btn btn-danger" id="restart-btn" style="display: none;">重新开始</button>
        </div>

        <div class="touch-controls">
            <button class="touch-btn touch-up" id="touch-up">↑</button>
            <button class="touch-btn touch-left" id="touch-left">←</button>
            <button class="touch-btn touch-down" id="touch-down">↓</button>
            <button class="touch-btn touch-right" id="touch-right">→</button>
        </div>
    </div>

    <script>
        const TILE_SIZE = 40;
        const COLS = 15;
        const ROWS = 12;
        const CANVAS_WIDTH = COLS * TILE_SIZE;
        const CANVAS_HEIGHT = ROWS * TILE_SIZE;

        const TILE = {
            EMPTY: 0,
            WALL: 1,
            KEY: 2,
            TRAP: 3,
            EXIT: 4
        };

        let canvas, ctx;
        let gameState = 'start';
        let player = { x: 1, y: 1 };
        let keys = [];
        let keysCollected = 0;
        let totalKeys = 3;
        let score = 0;
        let startTime = 0;
        let elapsedTime = 0;
        let map = [];

        let exitPos = { x: 13, y: 10 };

        function generateMap() {
            map = [];
            for (let y = 0; y < ROWS; y++) {
                map[y] = [];
                for (let x = 0; x < COLS; x++) {
                    map[y][x] = TILE.EMPTY;
                }
            }

            for (let x = 0; x < COLS; x++) {
                map[0][x] = TILE.WALL;
                map[ROWS - 1][x] = TILE.WALL;
            }
            for (let y = 0; y < ROWS; y++) {
                map[y][0] = TILE.WALL;
                map[y][COLS - 1] = TILE.WALL;
            }

            const walls = [
                [3, 3], [4, 3], [5, 3], [6, 3], [8, 3], [9, 3], [10, 3], [11, 3],
                [3, 5], [4, 5], [6, 5], [7, 5], [8, 5], [10, 5], [11, 5],
                [2, 7], [3, 7], [5, 7], [6, 7], [8, 7], [9, 7], [11, 7], [12, 7],
                [4, 9], [5, 9], [7, 9], [8, 9], [10, 9], [11, 9],
                [2, 4], [12, 4], [7, 2], [7, 6], [2, 8], [12, 8], [3, 10], [11, 10],
                [6, 1], [9, 1], [6, 11], [9, 11], [5, 2], [10, 2], [5, 10], [10, 10]
            ];
            walls.forEach(([x, y]) => map[y][x] = TILE.WALL);

            keys = [
                { x: 3, y: 2 },
                { x: 12, y: 2 },
                { x: 7, y: 8 }
            ];
            keys.forEach(k => map[k.y][k.x] = TILE.KEY);

            const traps = [
                [4, 4], [8, 4], [11, 6], [5, 8], [9, 9], [2, 6], [13, 5], [6, 10]
            ];
            traps.forEach(([x, y]) => map[y][x] = TILE.TRAP);

            map[exitPos.y][exitPos.x] = TILE.EXIT;
        }

        function initGame() {
            generateMap();
            player = { x: 1, y: 1 };
            keysCollected = 0;
            score = 0;
            elapsedTime = 0;
            startTime = Date.now();
            updateUI();
        }

        function draw() {
            ctx.fillStyle = '#1a0a2e';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    drawTile(x, y, map[y][x]);
                }
            }

            drawPlayer();
        }

        function drawTile(x, y, type) {
            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;

            ctx.fillStyle = '#3d2b5e';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.1)';
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

            switch (type) {
                case TILE.WALL:
                    const gradient = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
                    gradient.addColorStop(0, '#6b5b95');
                    gradient.addColorStop(1, '#4a3a6e');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                    ctx.strokeStyle = '#7c6aa8';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.moveTo(px + TILE_SIZE / 2, py);
                    ctx.lineTo(px + TILE_SIZE / 2, py + TILE_SIZE);
                    ctx.moveTo(px, py + TILE_SIZE / 2);
                    ctx.lineTo(px + TILE_SIZE, py + TILE_SIZE / 2);
                    ctx.stroke();
                    break;
                case TILE.KEY:
                    ctx.save();
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 15 + Math.sin(Date.now() / 200) * 5;
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 3, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(px + TILE_SIZE / 2 - 2, py + TILE_SIZE / 3, 4, TILE_SIZE / 2);
                    ctx.fillRect(px + TILE_SIZE / 2 + 2, py + TILE_SIZE * 0.6, 6, 4);
                    ctx.fillRect(px + TILE_SIZE / 2 + 2, py + TILE_SIZE * 0.75, 4, 4);
                    ctx.restore();
                    break;
                case TILE.TRAP:
                    ctx.save();
                    const pulse = Math.sin(Date.now() / 150) * 0.2 + 0.8;
                    ctx.shadowColor = '#ff4757';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = `rgba(255, 71, 87, ${pulse})`;
                    ctx.beginPath();
                    ctx.moveTo(px + TILE_SIZE / 2, py + 8);
                    ctx.lineTo(px + TILE_SIZE - 8, py + TILE_SIZE - 8);
                    ctx.lineTo(px + 8, py + TILE_SIZE - 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('!', px + TILE_SIZE / 2, py + TILE_SIZE / 2 + 3);
                    ctx.restore();
                    break;
                case TILE.EXIT:
                    ctx.save();
                    const exitPulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
                    ctx.shadowColor = keysCollected >= totalKeys ? '#2ed573' : '#666';
                    ctx.shadowBlur = 20;
                    if (keysCollected >= totalKeys) {
                        const exitGradient = ctx.createRadialGradient(
                            px + TILE_SIZE / 2, py + TILE_SIZE / 2, 0,
                            px + TILE_SIZE / 2, py + TILE_SIZE / 2, TILE_SIZE
                        );
                        exitGradient.addColorStop(0, 'rgba(46, 213, 115, 0.8)');
                        exitGradient.addColorStop(1, 'rgba(46, 213, 115, 0.2)');
                        ctx.fillStyle = exitGradient;
                    } else {
                        ctx.fillStyle = 'rgba(100, 100, 100, 0.5)';
                    }
                    ctx.fillRect(px + 4, py + 2, TILE_SIZE - 8, TILE_SIZE - 4);
                    ctx.fillStyle = keysCollected >= totalKeys ? '#2ed573' : '#555';
                    ctx.fillRect(px + 6, py + 4, TILE_SIZE - 12, TILE_SIZE - 8);
                    ctx.fillStyle = keysCollected >= totalKeys ? '#ffd700' : '#888';
                    ctx.beginPath();
                    ctx.arc(px + TILE_SIZE - 14, py + TILE_SIZE / 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    break;
            }
        }

        function drawPlayer() {
            const px = player.x * TILE_SIZE;
            const py = player.y * TILE_SIZE;

            ctx.save();
            ctx.shadowColor = '#74b9ff';
            ctx.shadowBlur = 15;

            ctx.fillStyle = '#74b9ff';
            ctx.beginPath();
            ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, TILE_SIZE / 2 - 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px + TILE_SIZE / 2 - 7, py + TILE_SIZE / 2 - 3, 5, 0, Math.PI * 2);
            ctx.arc(px + TILE_SIZE / 2 + 7, py + TILE_SIZE / 2 - 3, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2d3436';
            ctx.beginPath();
            ctx.arc(px + TILE_SIZE / 2 - 7, py + TILE_SIZE / 2 - 2, 2.5, 0, Math.PI * 2);
            ctx.arc(px + TILE_SIZE / 2 + 7, py + TILE_SIZE / 2 - 2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#2d3436';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2 + 5, 6, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 150, 150, 0.5)';
            ctx.beginPath();
            ctx.ellipse(px + TILE_SIZE / 2 - 12, py + TILE_SIZE / 2 + 5, 4, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(px + TILE_SIZE / 2 + 12, py + TILE_SIZE / 2 + 5, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function canMove(x, y) {
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
            if (map[y][x] === TILE.WALL) return false;
            return true;
        }

        function movePlayer(dx, dy) {
            if (gameState !== 'playing') return;

            const newX = player.x + dx;
            const newY = player.y + dy;

            if (canMove(newX, newY)) {
                player.x = newX;
                player.y = newY;
                checkTile();
            }
        }

        function checkTile() {
            const tile = map[player.y][player.x];

            switch (tile) {
                case TILE.KEY:
                    map[player.y][player.x] = TILE.EMPTY;
                    keysCollected++;
                    score += 100;
                    updateUI();
                    break;
                case TILE.TRAP:
                    gameOver(false);
                    break;
                case TILE.EXIT:
                    if (keysCollected >= totalKeys) {
                        gameOver(true);
                    }
                    break;
            }
        }

        function gameOver(won) {
            gameState = won ? 'win' : 'lose';
            elapsedTime = Math.floor((Date.now() - startTime) / 1000);

            if (won) {
                score += Math.max(0, 1000 - elapsedTime * 5);
                document.getElementById('win-time').textContent = formatTime(elapsedTime);
                document.getElementById('win-score').textContent = score;
                document.getElementById('win-overlay').classList.add('active');
            } else {
                document.getElementById('lose-score').textContent = score;
                document.getElementById('lose-overlay').classList.add('active');
                canvas.classList.add('shake');
                setTimeout(() => canvas.classList.remove('shake'), 500);
            }

            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('restart-btn').style.display = 'inline-block';
            updateUI();
        }

        function startGame() {
            document.getElementById('start-overlay').classList.remove('active');
            document.getElementById('win-overlay').classList.remove('active');
            document.getElementById('lose-overlay').classList.remove('active');
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'inline-block';

            initGame();
            gameState = 'playing';
        }

        function updateUI() {
            document.getElementById('keys-count').textContent = `${keysCollected} / ${totalKeys}`;
            document.getElementById('score').textContent = score;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function gameLoop() {
            if (gameState === 'playing') {
                elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('time').textContent = formatTime(Math.floor(elapsedTime));
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    movePlayer(0, -1);
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    movePlayer(0, 1);
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    movePlayer(-1, 0);
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    movePlayer(1, 0);
                    e.preventDefault();
                    break;
            }
        });

        document.getElementById('touch-up').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('touch-down').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('touch-left').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('touch-right').addEventListener('click', () => movePlayer(1, 0));

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        window.onload = () => {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;

            generateMap();
            draw();
            gameLoop();
        };
    </script>
</body>
</html>
